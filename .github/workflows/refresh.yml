name: Refresh roles
# Runs the role scan every morning and saves a slim list the dashboard shows as "New from the daily scan".
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan
        run: python3 scripts/scan_roles.py --days 14 --out scan_raw/latest.json
      - name: Build the slim file
        run: python3 scripts/make_scan_json.py scan_raw/latest.json data/scan.json
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/scan.json
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
