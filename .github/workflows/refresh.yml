name: Refresh roles
# Every morning: scan public job feeds, company job boards and national boards, rate each posting out of 10, check that listed postings are still open, and save the result for the dashboard.
on:
  schedule:
    - cron: '40 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan feeds and company boards
        run: python3 scripts/scan_roles.py --days 21 --out scan_raw/latest.json
      - name: Scan national boards
        run: python3 scripts/scan_boards.py scan_raw/boards.json
      - name: Rate every posting
        run: python3 scripts/make_scan_json.py
      - name: Check that postings are still open
        run: python3 scripts/check_live.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
